<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>TEIROUR KHEIREDDINE | PS4</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 35%, #17202b 0%, #090b0f 55%, #050609 100%);
      color: #dce3ec;
      font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    }

    /* =========================
       TOP BRAND
       ========================= */

    #brand {
      width: 100%;
      padding: 18px 20px;
      text-align: center;
      background: rgba(8, 11, 15, 0.92);
      border-bottom: 1px solid #202a36;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.35);
    }

    #brand b {
      display: block;
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    #brand span {
      display: block;
      margin-top: 5px;
      color: #7fd0a0;
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    /* =========================
       MAIN AREA
       ========================= */

    #wrap {
      min-height: calc(100vh - 78px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    /* =========================
       LOADING CARD
       ========================= */

    #loader-card {
      width: min(460px, 92vw);
      padding: 38px 30px;
      text-align: center;

      background: rgba(14, 18, 24, 0.94);
      border: 1px solid #263241;
      border-radius: 18px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    #logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      border: 2px solid #7fd0a0;

      color: #7fd0a0;
      font-size: 25px;
      font-weight: 800;

      background: #0a0e13;
      box-shadow:
        0 0 25px rgba(127, 208, 160, 0.12),
        inset 0 0 20px rgba(127, 208, 160, 0.05);
    }

    #loader-title {
      margin: 0;
      color: #ffffff;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    #loader-subtitle {
      margin-top: 7px;
      color: #7e8997;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* =========================
       SPINNER
       ========================= */

    #spin {
      position: relative;
      width: 48px;
      height: 48px;
      margin: 28px auto 18px;

      border: 4px solid #202a35;
      border-top-color: #7fd0a0;
      border-right-color: #7fd0a0;

      border-radius: 50%;
      animation: spin 0.85s linear infinite;

      box-shadow: 0 0 18px rgba(127, 208, 160, 0.12);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       MESSAGE
       ========================= */

    #msg {
      color: #aeb8c5;
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    /* =========================
       STATUS
       ========================= */

    #status-line {
      margin-top: 22px;
      padding: 9px 14px;

      border: 1px solid #1f2a35;
      border-radius: 8px;

      background: #0a0e13;
      color: #687687;

      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* =========================
       STATES
       ========================= */

    body.done #spin {
      display: none;
    }

    body.done #msg {
      color: #7fd0a0;
    }

    body.done #status-line {
      border-color: #294936;
      color: #7fd0a0;
    }

    body.fail #spin {
      display: none;
    }

    body.fail #msg {
      display: block;
      color: #d08a7f;
    }

    body.fail #status-line {
      border-color: #51312d;
      color: #d08a7f;
    }

    /* =========================
       LOG MODE
       ========================= */

    #state,
    #out {
      display: none;
    }

    body.log #wrap {
      display: block;
      padding: 18px;
    }

    body.log #loader-card {
      display: none;
    }

    body.log #state {
      display: block;
      margin-bottom: 12px;

      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
    }

    body.log #out {
      display: block;

      width: 100%;
      height: calc(100vh - 115px);

      overflow-y: auto;
      white-space: pre-wrap;

      padding: 15px;

      background: #080b0f;
      border: 1px solid #202a35;
      border-radius: 10px;

      color: #aeb8c5;

      font:
        12px/1.55 Consolas,
        Monaco,
        monospace;

      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.35);
    }

    /* =========================
       LOG COLORS
       ========================= */

    .ok,
    .safe {
      color: #7fd0a0;
    }

    .bad,
    .danger {
      color: #d08a7f;
    }

    .warn {
      color: #d8c07f;
    }

    code {
      color: #9fb3d0;
    }

    /* =========================
       FOOTER
       ========================= */

    #footer {
      margin-top: 25px;
      color: #4e5b69;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
       ========================= -->

  <div id="brand">
    <b>TEIROUR KHEIREDDINE</b>
    <span>PS4 WebKit • Homebrew Environment</span>
  </div>

  <!-- =========================
       MAIN
       ========================= -->

  <div id="wrap">

    <div id="loader-card">

<div id="logo">
  <img src="./logocs.png" alt="Teirour Kheireddine">
</div>

      <h1 id="loader-title">
        PS4 HOME
      </h1>

      <div id="loader-subtitle">
        Initializing Environment
      </div>

      <div id="spin"></div>

      <div id="msg">
        Restart your console
      </div>

      <div id="status-line">
        Please wait...
      </div>

      <div id="footer">
        TEIROUR KHEIREDDINE
      </div>

    </div>

    <!-- Original log elements -->
    <div id="state"></div>
    <div id="out"></div>

  </div>

  <!-- IMPORTANT:
       Keep jb.js unchanged
  -->

  <script type="module">
    import "./jb.js?v=10";
  </script>

</body>
</html>
